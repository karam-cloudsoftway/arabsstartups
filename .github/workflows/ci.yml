# CI/CD for arabsstartups.com
#
# Every pull request and every push to main runs four check jobs in parallel.
# There is one environment: production. A deploy happens only when a person
# starts this workflow by hand (Actions → CI → Run workflow → production), from
# main, after every check has passed on that same commit.
#
# Setup steps and the reasons behind each choice: docs/CI_CD.md
name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly re-scan of main: new advisories appear even when our code does not change.
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy to production after all checks pass (from main only)"
        type: choice
        options: [none, production]
        default: none

# Nothing by default. Each job asks for the least it needs.
permissions: {}

concurrency:
  # One run per trigger and branch. Only stale pull-request runs are cancelled,
  # so a push can never cancel a deploy that is already running.
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  ASTRO_TELEMETRY_DISABLED: "1"
  WRANGLER_SEND_METRICS: "false"
  # Pinned scanner versions and checksums. Bump on purpose: docs/CI_CD.md → "Updating pinned tools".
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
  ACTIONLINT_VERSION: "1.7.12"
  ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"

jobs:
  quality:
    name: Code quality and dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Lockfile uses only the npm registry
        run: node scripts/check-lockfile.mjs
      - name: Install exact versions from package-lock.json
        run: npm ci
      - name: Known vulnerabilities in site packages (moderate and above)
        run: npm audit --omit=dev --audit-level=moderate
      - name: Known vulnerabilities in all packages (high and above)
        run: npm audit --audit-level=high
      - name: Registry signatures and provenance
        run: npm audit signatures
      - name: Lint (quality, accessibility, project rules)
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Seed file matches its generator
        run: |
          npm run seed:build
          git diff --exit-code -- seed/seed.json

  security:
    name: Secrets and workflow security
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # whole history: a secret deleted in a later commit is still leaked
      - name: Secret scan of the whole history (gitleaks)
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -fsSL --retry 3 -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --verbose --no-banner .
      - name: Workflow syntax and shell scripts (actionlint + shellcheck)
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl -fsSL --retry 3 -o "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
      - name: Workflow security audit (zizmor)
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          version: "1.31.1"
          advanced-security: false
          annotations: true

  sast:
    name: Static analysis (Semgrep)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    container:
      image: semgrep/semgrep:1.183.0@sha256:2e45517a85e13a9cca14a2a00df6bb48affd66b8ebfae1b0991cd57578362fb0
    defaults:
      run:
        shell: sh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Semgrep (JavaScript, TypeScript, Node.js and secrets rules)
        run: >-
          semgrep scan --error --metrics=off --disable-version-check
          --config p/javascript --config p/typescript --config p/nodejs --config p/secrets

  browser-tests:
    name: Browser and production-build tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # Cloudflare's public Turnstile TEST keys (they always pass). Never real keys in CI.
      PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install exact versions from package-lock.json
        run: npm ci
      - name: Local .env for the test servers (throwaway keys)
        run: |
          npm run secrets:generate -- --write=.env
          {
            echo "PUBLIC_TURNSTILE_SITE_KEY=$PUBLIC_TURNSTILE_SITE_KEY"
            echo "TURNSTILE_SECRET_KEY=$TURNSTILE_SECRET_KEY"
            echo "TURNSTILE_ALLOWED_HOSTNAMES="
          } >> .env
      - name: Install Chromium for Playwright
        run: npx --no-install playwright install --with-deps chromium
      - name: Browser tests (desktop and mobile)
        run: npm run test:e2e
      - name: Production-build boundary tests
        run: npm run test:prod
      - name: Keep the test report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-attempt-${{ github.run_attempt }}
          path: |
            playwright-report
            test-results
          retention-days: 7

  deploy:
    name: Deploy to production
    needs: [quality, security, sast, browser-tests]
    if: github.event_name == 'workflow_dispatch' && inputs.deploy == 'production'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    environment:
      name: production
      url: ${{ steps.smoke.outputs.site_url }}
    concurrency:
      # One deploy at a time. A second one waits; it never interrupts.
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Deploy only from main
        run: |
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo "::error::Production deploys run from main only. This run is on $GITHUB_REF."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          # No shared dependency cache in the job that holds the deploy token.
          package-manager-cache: false
      - name: Install exact versions from package-lock.json
        run: npm ci
      - name: Build for production
        run: npm run build:production
      - name: Pre-deploy safety checks
        run: node scripts/predeploy.mjs production
      - name: Deploy to Cloudflare (the only step that sees the token)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --no-install wrangler deploy --message "commit ${GITHUB_SHA:0:12}, run ${GITHUB_RUN_ID}, by ${GITHUB_ACTOR}"
      - name: Smoke test the live site
        id: smoke
        run: node scripts/smoke-test.mjs
      - name: Deploy summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "### Deploy to production: ${JOB_STATUS}"
            echo "- Commit: \`${GITHUB_SHA:0:12}\`"
            echo "- Roll back: \`npx wrangler rollback --name arabsstartups\`, or Cloudflare → Workers & Pages → arabsstartups → Deployments."
          } >> "$GITHUB_STEP_SUMMARY"
