name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy after tests (staging or production)"
        type: choice
        options: [none, staging, production]
        default: none

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Cloudflare's public Turnstile TEST keys (always pass) — never real keys in CI.
      PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - name: Local .env for tests
        run: |
          npx emdash secrets generate --write=.env
          {
            echo "PUBLIC_TURNSTILE_SITE_KEY=$PUBLIC_TURNSTILE_SITE_KEY"
            echo "TURNSTILE_SECRET_KEY=$TURNSTILE_SECRET_KEY"
            echo "TURNSTILE_ALLOWED_HOSTNAMES="
          } >> .env
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - name: Production-build boundary tests
        run: npx playwright test -c playwright.prod.config.ts
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  deploy:
    needs: test
    if: github.event_name == 'workflow_dispatch' && inputs.deploy != 'none'
    runs-on: ubuntu-latest
    # Protect these environments in GitHub (required reviewers) — plan §8.6.
    environment: ${{ inputs.deploy }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy:${{ inputs.deploy }}
